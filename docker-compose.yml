services:

  postgres:
    image: postgres:16-alpine
    container_name: netwatch-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - netwatch


  redis:
    image: redis:7-alpine
    container_name: netwatch-redis
    restart: unless-stopped

    networks:
      - netwatch


networks:

  netwatch:
    driver: bridge


volumes:

  postgres_data:
